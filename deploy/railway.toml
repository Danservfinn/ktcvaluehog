# Railway Configuration for Dynasty Edge
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "deploy/Dockerfile.neo4j"

[deploy]
numReplicas = 1
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Neo4j requires these ports
[[deploy.ports]]
port = 7474    # HTTP (Browser)
protocol = "http"
public = true

[[deploy.ports]]
port = 7687    # Bolt (Driver connections)
protocol = "tcp"
public = true
